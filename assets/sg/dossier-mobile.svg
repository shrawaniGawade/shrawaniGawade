<text x="32" y="57" class="display" font-size="34" fill="#243F52" >A little about me</text><text x="32" y="110" class="body" font-size="24" fill="#243F52" >I’m Shrawani, an engineering student</text><text x="32" y="144" class="body" font-size="24" fill="#243F52" >exploring web development, AI tools</text><text x="32" y="178" class="body" font-size="24" fill="#243F52" >and automation.</text><text x="32" y="240" class="body" font-size="24" fill="#596A70" >I learn by building: turning ideas into</text><text x="32" y="274" class="body" font-size="24" fill="#596A70" >interfaces, testing what works, and</text><text x="32" y="308" class="body" font-size="24" fill="#596A70" >improving one detail at a time.</text><path d="M32 345H568" stroke="#DDCDBB"/><text x="32" y="394" class="body" font-size="24" fill="#B65F76" >Currently exploring</text><text x="32" y="436" class="body" font-size="23" fill="#243F52" >Web apps · AI tools · Automation</text>
