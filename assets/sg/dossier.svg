<text x="44" y="64" class="display" font-size="36" fill="#243F52" >Curiosity is where it starts.</text><text x="44" y="116" class="body" font-size="23" fill="#596A70" >I’m Shrawani, an engineering student exploring</text><text x="44" y="150" class="body" font-size="23" fill="#596A70" >web development, AI tools and automation.</text><text x="44" y="207" class="body" font-size="23" fill="#596A70" >I learn by building: turning ideas into interfaces,</text><text x="44" y="241" class="body" font-size="23" fill="#596A70" >testing what works, and improving as I go.</text><path d="M646 44V275" stroke="#DDCDBB"/><text x="681" y="82" class="display" font-size="26" fill="#243F52" >My creative corner</text><circle cx="688" cy="125" r="4" fill="#B65F76"/><text x="706" y="132" class="body" font-size="20" fill="#243F52" >Thoughtful web experiences</text><circle cx="688" cy="171" r="4" fill="#B65F76"/><text x="706" y="178" class="body" font-size="20" fill="#243F52" >AI &amp; automation experiments</text><circle cx="688" cy="217" r="4" fill="#B65F76"/><text x="706" y="224" class="body" font-size="20" fill="#243F52" >Small ideas, working demos</text>
